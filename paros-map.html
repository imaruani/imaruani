<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Grèce · Carte &amp; Itinéraires</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>:root {
  --bg: #f0ede8;
  --panel: #ffffff;
  --panel-2: #f5f2ed;
  --text: #1c1917;
  --muted: #78716c;
  --accent: #e63946;
  --accent-2: #f4a261;
  --link: #2a7de1;
  --border: rgba(0,0,0,0.09);
  --sea: #2ec4b6;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

body { display: flex; }

#sidebar {
  width: 380px;
  flex: 0 0 380px;
  height: 100vh;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 2px 0 12px rgba(0,0,0,0.08);
}

#sidebar header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #e63946 0%, #f4a261 100%);
  color: white;
}
#sidebar h1 { margin: 0; font-size: 20px; letter-spacing: 0.2px; color: white; }
#sidebar .subtitle { margin: 4px 0 0; color: rgba(255,255,255,0.82); font-size: 13px; }

.filters {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-row button {
  appearance: none;
  background: var(--panel-2);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  transition: all 120ms ease;
  font-weight: 500;
}
.filter-row button:hover { background: #ede9e3; color: var(--text); }
.filter-row button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(230,57,70,0.3);
}

.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  user-select: none;
  cursor: pointer;
}
.toggle input { accent-color: var(--accent); }

.star { color: var(--accent); }
.resa { color: var(--accent-2); }

#search {
  padding: 10px 12px;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  margin: 12px 16px 8px;
  width: calc(100% - 32px);
}
#search::placeholder { color: var(--muted); }
#search:focus { outline: 2px solid var(--accent); border-color: transparent; }

.list-wrapper { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

#placeList {
  list-style: none;
  margin: 0;
  padding: 0 8px 16px;
  overflow-y: auto;
  flex: 1;
}
#placeList li {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 2px;
  transition: background 100ms;
}
#placeList li:hover { background: #fef3f2; }
#placeList li .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 6px;
  flex: 0 0 10px;
  background: var(--sea);
}
#placeList li.fav .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(230,57,70,0.15); }
#placeList li .meta { display: flex; flex-direction: column; }
#placeList li .meta strong { font-size: 14px; font-weight: 600; color: var(--text); }
#placeList li .meta span { font-size: 12px; color: var(--muted); }
#placeList li.avoid .meta strong { text-decoration: line-through; color: var(--muted); }

#sidebar footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
}
#sidebar footer p { margin: 0; }

#mapWrap { flex: 1; position: relative; }
#map { width: 100%; height: 100vh; background: #a8d8e8; }

/* Custom markers */
.leaflet-marker-icon.fav-marker {
  filter: hue-rotate(0deg);
}
.pin {
  width: 28px;
  height: 36px;
  position: relative;
  display: block;
}
.pin::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--marker-color, #4a90e2);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 4px 10px rgba(0,0,0,0.45);
  border: 2px solid #fff;
}
.pin::after {
  content: var(--marker-icon, "");
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.pin.fav { --marker-color: #e63946; }
.pin.beach { --marker-color: #2ec4b6; }
.pin.restaurant { --marker-color: #e07c24; }
.pin.bar { --marker-color: #7b5ea7; }
.pin.hotel { --marker-color: #2a9d8f; }
.pin.breakfast { --marker-color: #f4a261; }
.pin.activity { --marker-color: #e76f51; }

/* Popups */
.leaflet-popup-content-wrapper {
  background: #ffffff;
  color: var(--text);
  border-radius: 14px;
  padding: 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  border: 1px solid rgba(0,0,0,0.07);
}
.leaflet-popup-content {
  margin: 0;
  width: 320px !important;
  max-height: 70vh;
  overflow-y: auto;
}
.leaflet-popup-tip { background: #ffffff; }
.leaflet-popup-close-button { color: #78716c !important; font-size: 20px !important; padding: 6px 8px !important; }

.popup {
  font-size: 13px;
  line-height: 1.45;
}
.popup .photo {
  width: 100%;
  height: 160px;
  background-size: cover;
  background-position: center;
  background-color: #e8f4f8;
  border-radius: 14px 14px 0 0;
  display: flex;
  align-items: flex-end;
  padding: 10px 14px;
  color: white;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.popup .photo.placeholder {
  background: linear-gradient(135deg, #e9f5f4, #dff0ee);
  height: 8px;
  border-radius: 14px 14px 0 0;
  padding: 0;
}
.popup .body { padding: 12px 16px 14px; }
.popup h3 { margin: 0 0 2px; font-size: 16px; font-weight: 700; }
.popup .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.popup .tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 3px 9px;
  border-radius: 999px;
  background: #f0ede8;
  color: var(--muted);
  font-weight: 500;
}
.popup .tag.fav { background: rgba(230,57,70,0.12); color: var(--accent); font-weight: 600; }
.popup .tag.resa { background: rgba(244,162,97,0.18); color: #c47a1e; }
.popup .tag.avoid { background: rgba(120,120,120,0.12); color: var(--muted); }

.rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0 8px;
}
.stars { color: #f59e0b; font-size: 14px; letter-spacing: 1px; }
.rating-num { font-weight: 700; font-size: 14px; color: var(--text); }
.review-count { font-size: 11px; color: var(--muted); }

.popup .notes { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 10px; }
.popup .note {
  background: #fafafa;
  padding: 8px 10px;
  border-radius: 8px;
  border-left: 3px solid var(--accent);
  border: 1px solid #f0ede8;
  border-left: 3px solid var(--accent);
}
.popup .note .author {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
  font-weight: 600;
}
.popup .note .text { font-size: 13px; color: var(--text); }

.popup .links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.popup .links a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: #f5f2ed;
  border: 1px solid #e8e4de;
  border-radius: 999px;
  text-decoration: none;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
  transition: all 100ms;
}
.popup .links a:hover { background: #ede9e3; }
.popup .links a.maps { background: rgba(42,125,225,0.08); color: var(--link); border-color: rgba(42,125,225,0.2); }
.popup .links a.insta { background: linear-gradient(135deg, rgba(225,72,128,0.10), rgba(255,148,72,0.10)); color: #c2185b; border-color: rgba(194,24,91,0.2); }

/* ── Tab nav ───────────────────────────────────────── */
.tab-nav {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.tab-btn {
  flex: 1;
  appearance: none;
  border: none;
  padding: 7px 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  background: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.7);
  transition: all 140ms;
}
.tab-btn.active {
  background: white;
  color: var(--accent);
}
.tab-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.tab-panel.active { display: flex; }

/* ── Itinerary tab ─────────────────────────────────── */
.itin-wrapper {
  overflow-y: auto;
  flex: 1;
  padding: 12px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.itin-dest {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--panel);
}
.itin-dest-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  color: white;
}
.itin-emoji { font-size: 22px; }
.itin-dest-name { font-size: 16px; font-weight: 700; }

.itin-suggestions {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 14px;
  background: #fafafa;
  border-bottom: 1px solid var(--border);
}
.itin-sugg {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
}

.itin-day {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}
.itin-day-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.itin-day-date {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  background: rgba(230,57,70,0.08);
  padding: 2px 8px;
  border-radius: 999px;
}
.itin-day-label { font-size: 13px; font-weight: 600; color: var(--text); }

.itin-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 0;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--text);
  border-radius: 6px;
}
.itin-item.clickable {
  cursor: pointer;
  padding: 5px 6px;
  margin: 0 -6px;
}
.itin-item.clickable:hover { background: #fef3f2; }
.itin-item.itin-star .itin-text { font-weight: 600; }
.itin-time {
  flex: 0 0 52px;
  font-size: 11px;
  color: var(--muted);
  padding-top: 1px;
  font-weight: 500;
}
.itin-icon { flex: 0 0 18px; }
.itin-text { flex: 1; }
.itin-goto {
  flex: 0 0 16px;
  font-size: 12px;
  color: var(--accent);
  opacity: 0.6;
  padding-top: 1px;
}
.itin-item.clickable:hover .itin-goto { opacity: 1; }

.itin-tip {
  margin-top: 6px;
  background: #fffbf0;
  border: 1px solid #f4e2a0;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12px;
  color: #7a5c00;
  line-height: 1.45;
}

/* ─── Programme card (slots) ─── */
.itin-programme {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin: 2px 0 4px;
}

.itin-prog-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent;
}
.itin-prog-row:last-child { border-bottom: none; }

.itin-prog-row.cat-breakfast { border-left-color: #f4a261; }
.itin-prog-row.cat-beach     { border-left-color: #2ec4b6; }
.itin-prog-row.cat-lunch     { border-left-color: #e9c46a; }
.itin-prog-row.cat-activity  { border-left-color: #52b788; }
.itin-prog-row.cat-sunset    { border-left-color: #e76f51; }
.itin-prog-row.cat-dinner    { border-left-color: #e63946; }

.itin-prog-cat {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 58px;
  padding-top: 1px;
  gap: 2px;
}
.itin-prog-icon { font-size: 1.25rem; line-height: 1; }
.itin-prog-label-text {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}

.itin-prog-opts {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.itin-prog-opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.35;
}
.itin-prog-opt.clickable {
  cursor: pointer;
  transition: background 0.15s;
}
.itin-prog-opt.clickable:hover { background: #fef3f2; }
.itin-prog-opt.clickable:hover .itin-goto { opacity: 1; }
.itin-prog-opt.itin-star { font-weight: 600; }
.itin-prog-opt .itin-goto {
  opacity: 0;
  font-size: 0.7rem;
  color: var(--accent);
  flex-shrink: 0;
  transition: opacity 0.15s;
}

/* Mobile-only buttons (FAB + close) — hidden on desktop */
#openSidebar, #closeSidebar { display: none; }

/* ─────────────────── Mobile (≤ 720px) ────────────────── */
@media (max-width: 720px) {
  html, body { overscroll-behavior: none; }
  body {
    flex-direction: column;
    overflow: hidden;
  }

  /* Map: full-screen behind the sidebar */
  #mapWrap {
    position: fixed;
    inset: 0;
    flex: none;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #map { width: 100%; height: 100%; }

  /* Sidebar: bottom-sheet overlay */
  #sidebar {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    flex: none;
    z-index: 2000;
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
    border-right: none;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
  }
  #sidebar.open { transform: translateY(0); }

  #sidebar header {
    padding: 12px 56px 10px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #sidebar h1 { font-size: 17px; }
  #sidebar .subtitle { font-size: 11px; margin-top: 2px; }

  /* Close button (top-right of sidebar) */
  #closeSidebar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 10;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: none;
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }

  /* FAB to open sidebar */
  #openSidebar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.28);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  #openSidebar:active { transform: translateX(-50%) scale(0.96); }

  /* Bigger touch targets */
  .tab-btn { padding: 11px 0; font-size: 14px; }
  .filter-row { gap: 7px; }
  .filter-row button { padding: 8px 13px; font-size: 13px; }
  .filters { padding: 10px 14px 12px; gap: 10px; }
  .toggle { font-size: 13px; padding: 4px 0; }

  /* Search */
  #search {
    margin: 10px 14px 6px;
    width: calc(100% - 28px);
    padding: 11px 14px;
    font-size: 15px;
  }

  /* Place list */
  #placeList { padding: 0 8px 24px; }
  #placeList li { padding: 12px; gap: 12px; }
  #placeList li .meta strong { font-size: 15px; }
  #placeList li .meta span { font-size: 12.5px; }
  #placeList li .dot { width: 11px; height: 11px; flex-basis: 11px; }

  /* Popup: fit screen */
  .leaflet-popup-content {
    width: min(85vw, 320px) !important;
    max-height: 75vh;
  }
  .popup .photo { height: 140px; }
  .popup .body { padding: 12px 14px 14px; }
  .popup h3 { font-size: 16px; }

  /* Itineraries */
  .itin-wrapper { padding: 12px 12px 28px; gap: 14px; }
  .itin-item { font-size: 13px; padding: 7px 0; }
  .itin-item.clickable { padding: 7px 8px; margin: 0 -8px; }
  .itin-prog-cat { min-width: 50px; }
  .itin-prog-label-text { font-size: 0.6rem; }
  .itin-prog-opt { font-size: 0.82rem; padding: 4px 4px; }
  .itin-prog-opt .itin-goto { opacity: 0.4; }

  /* Footer */
  #sidebar footer { padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }

  /* Leaflet zoom controls: avoid clash with safe-area */
  .leaflet-top.leaflet-left { top: max(10px, env(safe-area-inset-top)); }
}
</style>
</head>
<body>
  <aside id="sidebar">
    <button id="closeSidebar" aria-label="Fermer">✕</button>
    <header>
      <h1>🇬🇷 Grèce — Bonnes adresses</h1>
      <p class="subtitle">Paros · Antiparos · Sifnos · Milos · Kimolos · Athènes</p>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="map-tab">🗺 Carte</button>
        <button class="tab-btn" data-tab="itinerary-tab">📅 Itinéraires</button>
      </nav>
    </header>

    <!-- TAB 1: MAP -->
    <div id="map-tab" class="tab-panel active">
      <div class="filters">
        <div class="filter-row" id="islandFilter">
          <button data-island="all" class="active">Tout</button>
          <button data-island="Paros">Paros</button>
          <button data-island="Antiparos">Antiparos</button>
          <button data-island="Athènes">Athènes</button>
          <button data-island="Sifnos">Sifnos</button>
          <button data-island="Milos">Milos</button>
          <button data-island="Kimolos">Kimolos</button>
        </div>
        <div class="filter-row" id="categoryFilter">
          <button data-category="all" class="active">Tout</button>
          <button data-category="restaurant">🍽 Restos</button>
          <button data-category="beach">🏖 Plages</button>
          <button data-category="bar">🍸 Bars</button>
          <button data-category="hotel">🏨 Hôtels</button>
          <button data-category="breakfast">☕ Petit déj</button>
          <button data-category="activity">⚓ Activités</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="favOnly" />
          <span>Coups de cœur uniquement <span class="star">★</span></span>
        </label>
      </div>
      <div class="list-wrapper">
        <input id="search" type="search" placeholder="Rechercher un lieu, une zone…" />
        <ul id="placeList"></ul>
      </div>
    </div>

    <!-- TAB 2: ITINERAIRES -->
    <div id="itinerary-tab" class="tab-panel" style="display:none">
      <div class="itin-wrapper" id="itinContent"></div>
    </div>

    <footer>
      <p>Les <span class="star">★</span> sont les coups de cœur · <span class="resa">⛔</span> = réserver</p>
    </footer>
  </aside>

  <main id="mapWrap">
    <div id="map"></div>
    <button id="openSidebar" aria-label="Ouvrir la liste">📋 Adresses & itinéraires</button>
  </main>

/* ─────────────────────── RENDER ITINERARY TAB ─────────────────────── */
(function () {
  function escHtml(s) {
    if (!s) return "";
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderItineraries() {
    const container = document.getElementById("itinContent");
    if (!container) return;

    let html = "";

    ITINERARIES.forEach(dest => {
      html += `
        <div class="itin-dest">
          <div class="itin-dest-header" style="background:${escHtml(dest.color)}">
            <span class="itin-emoji">${dest.emoji}</span>
            <div>
              <div class="itin-dest-name">${escHtml(dest.title)}</div>
            </div>
          </div>`;

      // Suggestions bloc
      if (dest.suggestions && dest.suggestions.length) {
        html += `<div class="itin-suggestions">`;
        dest.suggestions.forEach(s => {
          html += `<div class="itin-sugg"><span>${s.icon}</span><span>${escHtml(s.text)}</span></div>`;
        });
        html += `</div>`;
      }

      // Days
      dest.days.forEach(day => {
        html += `
          <div class="itin-day">
            <div class="itin-day-header">
              <span class="itin-day-date">${escHtml(day.date)}</span>
              <span class="itin-day-label">${escHtml(day.label)}</span>
            </div>`;

        if (day.slots) {
          // Programme card with category slots
          html += `<div class="itin-programme">`;
          day.slots.forEach(slot => {
            html += `<div class="itin-prog-row cat-${escHtml(slot.cat)}">
              <div class="itin-prog-cat">
                <span class="itin-prog-icon">${slot.icon}</span>
                <span class="itin-prog-label-text">${escHtml(slot.label)}</span>
              </div>
              <div class="itin-prog-opts">`;
            slot.options.forEach(opt => {
              const cls = `itin-prog-opt${opt.star ? " itin-star" : ""}${opt.placeId ? " clickable" : ""}`;
              html += `<div class="${cls}"${opt.placeId ? ` data-place-id="${escHtml(opt.placeId)}"` : ""}>
                <span>${escHtml(opt.text)}</span>
                ${opt.placeId ? '<span class="itin-goto">↗</span>' : ""}
              </div>`;
            });
            html += `</div></div>`;
          });
          html += `</div>`;
        } else if (day.items) {
          day.items.forEach(item => {
            const placeLink = item.placeId
              ? `data-place-id="${escHtml(item.placeId)}" class="itin-item clickable${item.star ? ' itin-star' : ''}"`
              : `class="itin-item${item.star ? ' itin-star' : ''}"`;
            html += `
              <div ${placeLink}>
                <span class="itin-time">${escHtml(item.time)}</span>
                <span class="itin-icon">${item.icon}</span>
                <span class="itin-text">${escHtml(item.text)}</span>
                ${item.placeId ? '<span class="itin-goto">↗</span>' : ''}
              </div>`;
          });
        }

        if (day.tip) {
          html += `<div class="itin-tip">💡 ${escHtml(day.tip)}</div>`;
        }

        html += `</div>`;
      });

      html += `</div>`;
    });

    container.innerHTML = html;

    // Click: switch to map tab and fly to place
    container.addEventListener("click", e => {
      const item = e.target.closest("[data-place-id]");
      if (!item) return;
      const id = item.dataset.placeId;
      const place = (window.PLACES || []).find(p => p.id === id);
      if (!place || !place.coords) return;

      // Switch to map tab
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => { p.style.display = "none"; p.classList.remove("active"); });
      document.querySelector('[data-tab="map-tab"]').classList.add("active");
      document.getElementById("map-tab").style.display = "";
      document.getElementById("map-tab").classList.add("active");

      // Close mobile bottom-sheet so the map is visible
      const closedMobile = window._closeSidebarMobile && window._closeSidebarMobile();
      const delay = closedMobile ? 320 : 0;

      // Fly to place (map exposed on window by app.js)
      if (window._map) {
        setTimeout(() => {
          window._map.invalidateSize();
          window._map.setView(place.coords, 15, { animate: true });
          const m = window._markers && window._markers.get(id);
          if (m) setTimeout(() => m.openPopup(), 400);
        }, delay);
      }
    });
  }

  // Wait for DOM
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderItineraries);
  } else {
    renderItineraries();
  }
})();
</script>
  <script>(function () {
  const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true,
  }).setView([37.07, 25.18], 11);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors, <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  const ICONS = {
    restaurant: "🍽",
    beach: "🏖",
    bar: "🍸",
    hotel: "🏨",
    breakfast: "☕",
    activity: "⚓",
  };

  function makeIcon(p) {
    const cls = ["pin", p.category];
    if (p.highlight) cls.push("fav");
    const icon = ICONS[p.category] || "";
    return L.divIcon({
      className: "",
      html: `<span class="${cls.join(" ")}" style="--marker-icon:'${icon}'"></span>`,
      iconSize: [28, 36],
      iconAnchor: [14, 34],
      popupAnchor: [0, -28],
    });
  }

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function buildPopup(p) {
    const tags = [];
    if (p.highlight) tags.push('<span class="tag fav">★ Coup de cœur</span>');
    if (p.reservation) tags.push('<span class="tag resa">⛔ Réserver</span>');
    if (p.avoid) tags.push('<span class="tag avoid">À éviter</span>');
    if (p.category) tags.push(`<span class="tag">${escapeHtml(p.category)}</span>`);
    if (p.area) tags.push(`<span class="tag">${escapeHtml(p.area)}</span>`);
    if (p.cuisine) tags.push(`<span class="tag">${escapeHtml(p.cuisine)}</span>`);

    // Google rating stars
    let ratingHtml = "";
    if (p.rating) {
      const full = Math.floor(p.rating);
      const half = (p.rating - full) >= 0.5;
      let stars = "★".repeat(full) + (half ? "½" : "") + "☆".repeat(5 - full - (half ? 1 : 0));
      const reviews = p.review_count ? ` <span class="review-count">(${p.review_count.toLocaleString("fr")} avis)</span>` : "";
      ratingHtml = `<div class="rating"><span class="stars">${stars}</span><span class="rating-num">${p.rating}</span>${reviews}</div>`;
    }

    const notes = (p.notes || [])
      .map((n) => `
        <div class="note">
          <div class="author">${escapeHtml(n.author)}</div>
          <div class="text">${escapeHtml(n.text)}</div>
        </div>`)
      .join("");

    const links = [];
    if (p.google_maps_url) links.push(`<a class="maps" href="${escapeHtml(p.google_maps_url)}" target="_blank" rel="noopener">📍 Google Maps</a>`);
    if (p.instagram_url || p.instagram) {
      const url = p.instagram_url || `https://www.instagram.com/${(p.instagram || "").replace(/^@/, "")}`;
      links.push(`<a class="insta" href="${escapeHtml(url)}" target="_blank" rel="noopener">📷 Instagram</a>`);
    }
    if (p.website) links.push(`<a href="${escapeHtml(p.website)}" target="_blank" rel="noopener">🌐 Site</a>`);
    if (p.phone) {
      const tel = p.phone.replace(/\s/g, "");
      links.push(`<a href="tel:${escapeHtml(tel)}">📞 ${escapeHtml(p.phone)}</a>`);
    }

    const photoBlock = p.photo_url
      ? `<div class="photo" style="background-image: url('${escapeHtml(p.photo_url)}')"></div>`
      : '<div class="photo placeholder"></div>';

    return `
      <div class="popup">
        ${photoBlock}
        <div class="body">
          <h3>${escapeHtml(p.name)}</h3>
          ${ratingHtml}
          <div class="tags">${tags.join("")}</div>
          <div class="notes">${notes || ""}</div>
          <div class="links">${links.join("")}</div>
        </div>
      </div>`;
  }

  // State
  const state = {
    island: "all",
    category: "all",
    favOnly: false,
    search: "",
  };

  window._map = map;
  const markers = new Map();
  window._markers = markers;
  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    maxClusterRadius: 36,
    iconCreateFunction: (c) => {
      const count = c.getChildCount();
      const hasFav = c.getAllChildMarkers().some((m) => m.options.placeData && m.options.placeData.highlight);
      const bg = hasFav ? "#e63946" : "#2a7de1";
      return L.divIcon({
        html: `<div style="background:${bg};color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,0.25);border:2.5px solid #fff;">${count}</div>`,
        className: "",
        iconSize: [34, 34],
      });
    },
  });
  map.addLayer(cluster);

  // Build markers
  (window.PLACES || []).forEach((p) => {
    if (!p.coords) return;
    const m = L.marker(p.coords, { icon: makeIcon(p), placeData: p });
    m.bindPopup(buildPopup(p), { maxWidth: 340 });
    markers.set(p.id, m);
  });

  function applyFilters() {
    cluster.clearLayers();
    const q = state.search.trim().toLowerCase();
    const visible = [];
    (window.PLACES || []).forEach((p) => {
      const m = markers.get(p.id);
      if (!m) return;
      if (state.island !== "all" && p.island !== state.island) return;
      if (state.category !== "all" && p.category !== state.category) return;
      if (state.favOnly && !p.highlight) return;
      if (q) {
        const hay = (p.name + " " + (p.area || "") + " " + (p.cuisine || "")).toLowerCase();
        if (!hay.includes(q)) return;
      }
      cluster.addLayer(m);
      visible.push(p);
    });
    renderList(visible);
  }

  function renderList(places) {
    const ul = document.getElementById("placeList");
    ul.innerHTML = "";
    places
      .slice()
      .sort((a, b) => {
        if (a.highlight !== b.highlight) return a.highlight ? -1 : 1;
        return a.name.localeCompare(b.name);
      })
      .forEach((p) => {
        const li = document.createElement("li");
        if (p.highlight) li.classList.add("fav");
        if (p.avoid) li.classList.add("avoid");
        li.innerHTML = `
          <span class="dot"></span>
          <span class="meta">
            <strong>${p.highlight ? "★ " : ""}${escapeHtml(p.name)}</strong>
            <span>${escapeHtml([p.area, p.island].filter(Boolean).join(" · "))}</span>
          </span>`;
        li.addEventListener("click", () => {
          if (!p.coords) return;
          const wasMobile = closeSidebarMobile();
          const fly = () => {
            map.invalidateSize();
            map.setView(p.coords, 15, { animate: true });
            const m = markers.get(p.id);
            if (m) m.openPopup();
          };
          if (wasMobile) setTimeout(fly, 300); else fly();
        });
        ul.appendChild(li);
      });
  }

  // UI wiring
  document.querySelectorAll("#islandFilter button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#islandFilter button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      state.island = b.dataset.island;
      applyFilters();
      fitToVisible();
    });
  });

  document.querySelectorAll("#categoryFilter button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#categoryFilter button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      state.category = b.dataset.category;
      applyFilters();
    });
  });

  document.getElementById("favOnly").addEventListener("change", (e) => {
    state.favOnly = e.target.checked;
    applyFilters();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    state.search = e.target.value;
    applyFilters();
  });

  function fitToVisible() {
    const bounds = cluster.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
    }
  }

  // Mobile sidebar (bottom sheet)
  const sidebarEl = document.getElementById("sidebar");
  const openBtn = document.getElementById("openSidebar");
  const closeBtn = document.getElementById("closeSidebar");
  function isMobile() { return window.matchMedia("(max-width: 720px)").matches; }
  function openSidebar() { sidebarEl.classList.add("open"); }
  function closeSidebar() { sidebarEl.classList.remove("open"); }
  function closeSidebarMobile() {
    if (isMobile() && sidebarEl.classList.contains("open")) {
      closeSidebar();
      return true;
    }
    return false;
  }
  if (openBtn) openBtn.addEventListener("click", openSidebar);
  if (closeBtn) closeBtn.addEventListener("click", closeSidebar);
  window._closeSidebarMobile = closeSidebarMobile;

  // Tab switching
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const target = btn.dataset.tab;
      document.querySelectorAll(".tab-panel").forEach(p => {
        p.style.display = p.id === target ? "" : "none";
        p.classList.toggle("active", p.id === target);
      });
      if (target === "map-tab") setTimeout(() => map.invalidateSize(), 50);
    });
  });

  applyFilters();
  setTimeout(fitToVisible, 100);
})();
</script>

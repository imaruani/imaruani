<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, c = document.getElementById('c'), x = c.getContext('2d');
const C = { ink:'#5B0F22', hot:'#C9476A' };
const SANS = '"Inter Tight","Inter",sans-serif', MONO = '"JetBrains Mono",monospace';
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const ei = t => Math.pow(clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
const lerp = (a,b,t) => a + (b-a)*t;
const hash = (a,b) => { let h = (a*374761393 + b*668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
let seed = 5; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const beat = t => { const k = t % 1; return Math.exp(-Math.pow((k-.08)/.05,2)) + .65*Math.exp(-Math.pow((k-.3)/.06,2)); };
let FRAME = 0;

/* ---------- Corps sans tête : nuage de points 3D ---------- */
const pts = [];
const cap = (a, b, r0, r1, n, zs=.8) => { const ax=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], L=Math.hypot(...ax)||1, d=ax.map(v=>v/L);
  let u = Math.abs(d[1])<.9 ? [d[2],0,-d[0]] : [1,0,0]; const ul=Math.hypot(...u); u=u.map(v=>v/ul);
  const v=[d[1]*u[2]-d[2]*u[1], d[2]*u[0]-d[0]*u[2], d[0]*u[1]-d[1]*u[0]];
  for (let i=0;i<n;i++){ const t=rnd(), th=rnd()*6.283, r=r0+(r1-r0)*t, cx=Math.cos(th)*r, sy=Math.sin(th)*r;
    pts.push([a[0]+ax[0]*t+u[0]*cx+v[0]*sy, a[1]+ax[1]*t+u[1]*cx+v[1]*sy, (a[2]+ax[2]*t+u[2]*cx+v[2]*sy)*zs]); } };
const ell = (c0, rx, ry, rz, n) => { for (let i=0;i<n;i++){ const y=1-2*rnd(), r=Math.sqrt(1-y*y), th=rnd()*6.283; pts.push([c0[0]+Math.cos(th)*r*rx, c0[1]+y*ry, c0[2]+Math.sin(th)*r*rz]); } };
cap([0,.62,0],[0,.68,0],.05,.046,160,1);                                     // base du cou seulement
cap([0,.55,0],[0,.16,0],.19,.135,2600,.62); cap([-.2,.57,0],[.2,.57,0],.06,.06,560,1); cap([0,.17,0],[0,-.02,0],.135,.16,1100,.65);
for (const s of [-1,1]) { cap([s*.23,.56,0],[s*.29,.28,.02],.055,.042,640,1); cap([s*.29,.28,.02],[s*.33,.02,.06],.042,.03,520,1); ell([s*.34,-.05,.07],.03,.05,.022,170);
  cap([s*.085,-.02,0],[s*.1,-.46,0],.085,.055,1150,1); cap([s*.1,-.46,0],[s*.11,-.88,-.01],.055,.035,860,1); cap([s*.11,-.91,-.02],[s*.115,-.93,.09],.035,.03,170,1); }
const HEART = [-.045,.44,.06];
const PATHS = [ [[-.045,.44,.05],[-.2,.56,.03],[-.29,.28,.04],[-.33,.0,.07]], [[-.045,.44,.05],[.2,.56,.03],[.29,.28,.04],[.33,.0,.07]], [[-.045,.44,.05],[-.07,.1,.04],[-.1,-.45,.03],[-.11,-.88,.02]], [[-.045,.44,.05],[.07,.1,.04],[.1,-.45,.03],[.11,-.88,.02]] ];
const along = (path, t) => { const n = path.length-1, f = clamp(t)*n, i = Math.min(n-1, Math.floor(f)), k = f - i; return [0,1,2].map(j => lerp(path[i][j], path[i+1][j], k)); };

/* ---------- Caméra 3D en perspective ---------- */
// cam : cible (tx,ty,tz), yaw (tour), pitch (plongée +, contre-plongée -), roll, dist, f (focale en px)
function mkcam(o) { const cy=Math.cos(o.yaw||0), sy=Math.sin(o.yaw||0), cp=Math.cos(o.pitch||0), sp=Math.sin(o.pitch||0), cr=Math.cos(o.roll||0), sr=Math.sin(o.roll||0);
  return { ...o, cy, sy, cp, sp, cr, sr, tx:o.tx||0, ty:o.ty??.1, tz:o.tz||0, dist:o.dist??2.4, f:o.f||1500 }; }
function proj(cam, px, py, pz) { const X0 = px-cam.tx, Y0 = py-cam.ty, Z0 = pz-cam.tz;
  const x1 = X0*cam.cy - Z0*cam.sy, z1 = X0*cam.sy + Z0*cam.cy, y2 = Y0*cam.cp - z1*cam.sp, z2 = Y0*cam.sp + z1*cam.cp, zc = z2 + cam.dist;
  if (zc < .06) return null; const k = cam.f/zc, xs = x1*k, ys = y2*k; return [W/2 + xs*cam.cr - ys*cam.sr, H/2 - (xs*cam.sr + ys*cam.cr), k, zc]; }
const mix = (a, b, t) => { const o = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) o[k] = lerp(a[k] ?? 0, b[k] ?? 0, t); return o; };
const shake = (T, amt=.006) => ({ yaw: Math.sin(T*7.3)*amt + Math.sin(T*13.1)*amt*.5, pitch: Math.cos(T*8.7)*amt, roll: Math.sin(T*5.9)*amt*.6 });
function camOf(a, b, t, T, sh=.006) { const o = mix(a, b, t), s = shake(T, sh); o.yaw += s.yaw; o.pitch += s.pitch; o.roll = (o.roll||0) + s.roll; return mkcam(o); }

/* ---------- Décor ---------- */
function bg(T, hot=0) {
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#FFE6EC'); g.addColorStop(.5,'#F9C3CE'); g.addColorStop(1,'#EE94A9'); x.fillStyle = g; x.fillRect(0,0,W,H);
  [[.3,.25,900,.75],[.75,.6,800,.5],[.45,.9,700,.35]].forEach(([px,py,r,a],i) => { const cx = W*px + Math.sin(T*.9+i*2)*160, cy = H*py + Math.cos(T*.7+i)*180;
    const rg = x.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,`rgba(255,255,255,${a})`); rg.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = rg; x.fillRect(0,0,W,H); });
  if (hot) { x.fillStyle = `rgba(255,255,255,${hot})`; x.fillRect(0,0,W,H); }
}
function grain() { for (let i=0;i<900;i++){ const r=hash(i,FRAME), r2=hash(i+7000,FRAME); x.fillStyle=`rgba(91,15,34,${.015+r*.03})`; x.fillRect(r*W, r2*H, 2, 2); } }
function bars(a=1) { x.fillStyle = `rgba(91,15,34,${.92*a})`; x.fillRect(0,0,W,150); x.fillRect(0,H-150,W,150); }   // bandes cinéma

// o.light : hauteur de l'anneau de lumière ; o.rev : 1 = corps révélé (bordeaux), 0 = rose pâle ; o.pass : révèle ce que la lumière a déjà traversé
function body(cam, o={}) {
  const light = o.light ?? 9, band = o.band ?? .07, a0 = o.alpha ?? 1, rev0 = o.rev ?? 1, dir = o.dir ?? 1;
  for (let i=0;i<pts.length;i++) { const p = pts[i], q = proj(cam, p[0], p[1], p[2]); if (!q) continue;
    const X = q[0], Y = q[1]; if (X < -60 || X > W+60 || Y < -60 || Y > H+60) continue;
    const lit = Math.max(0, 1 - Math.abs(p[1]-light)/band), rev = o.pass ? ((p[1]-light)*dir > 0 ? 1 : 0) : rev0;
    let s = clamp(q[2]/700, .5, 60) * 3.2, a = clamp(1.25 - s/26, .08, 1);       // très près = gros et diffus (flou de profondeur)
    if (lit > 0) { s += lit*5; x.fillStyle = `rgba(255,255,255,${(.7+lit*.3)*a0})`; }
    else x.fillStyle = rev ? `rgba(110,22,45,${.82*a*a0})` : `rgba(214,104,130,${.6*a*a0})`;
    if (s > 7) { x.beginPath(); x.arc(X, Y, s/2, 0, 6.283); x.fill(); } else x.fillRect(X-s/2, Y-s/2, s, s);
  }
  if (Math.abs(light) < 1.2) { const cpt = proj(cam, 0, light, 0); if (cpt) { x.save(); x.translate(cpt[0], cpt[1]); x.rotate(-(cam.roll||0)); x.shadowColor='rgba(255,255,255,1)'; x.shadowBlur=50; x.strokeStyle='rgba(255,255,255,.95)'; x.lineWidth=Math.max(3, cpt[2]*.006);
    x.beginPath(); x.ellipse(0, 0, cpt[2]*.5, Math.max(8, Math.abs(cpt[2]*.5*Math.sin(cam.pitch||.12))), 0, 0, 6.283); x.stroke(); x.restore(); } }
}
function heart(T, cam, a=1) { const q = proj(cam, ...HEART); if (!q) return; const [hx,hy,k] = q, b = beat(T*1.3);
  for (let j=0;j<3;j++){ const ph = ((T*1.3 + j/3) % 1), r = k*(.04 + ph*.3); x.strokeStyle = `rgba(142,43,68,${(1-ph)*.6*a})`; x.lineWidth = Math.max(3, k*.004); x.beginPath(); x.arc(hx,hy,r,0,6.283); x.stroke(); }
  const R = k*(.09+b*.06), rg = x.createRadialGradient(hx,hy,0,hx,hy,R*1.6); rg.addColorStop(0,`rgba(201,71,106,${.95*a})`); rg.addColorStop(.55,`rgba(201,71,106,${.5*a})`); rg.addColorStop(1,'rgba(201,71,106,0)'); x.fillStyle = rg; x.beginPath(); x.arc(hx,hy,R*1.6,0,6.283); x.fill(); }
function blood(T, cam, a=1, speed=.6) { PATHS.forEach((path, pi) => { for (let j=0;j<30;j++){ const ph = (T*speed + j/30 + pi*.13) % 1, p = along(path, ph), q = proj(cam, p[0] + Math.sin(j*3+T*5)*.006, p[1], p[2]); if (!q) continue;
  const s = clamp(q[2]*.011, 3, 70); x.fillStyle = `rgba(91,15,34,${clamp(1.1 - s/60, .15, .95)*a})`; x.beginPath(); x.arc(q[0], q[1], s, 0, 6.283); x.fill(); } }); }
function sparks(T, cam, a=1) { for (let i=0;i<90;i++){ const p = pts[(i*131) % pts.length], q = proj(cam, p[0], p[1], p[2]); if (!q) continue; const tw = .5 + .5*Math.sin(T*7 + i*1.7); if (tw < .6) continue;
  const s = clamp(q[2]*.012, 6, 40)*tw; x.save(); x.translate(q[0], q[1]); x.rotate(.785); x.fillStyle = `rgba(255,255,255,${tw*a})`; x.shadowColor='rgba(255,255,255,1)'; x.shadowBlur=20; x.fillRect(-s/2,-1.5,s,3); x.fillRect(-1.5,-s/2,3,s); x.restore(); } }
function callouts(cam, lt) { [[-.2,.3,.1,'Peau',-1],[-.045,.44,.1,'Cœur',1,30],[.31,.1,.07,'Sang',1],[-.1,-.4,.05,'Corps entier',-1]].forEach(([px,py,pz,txt,side,dy],i) => { const p = eo((lt - i*.12)/.3); if (p<=0) return; const q = proj(cam, px,py,pz); if (!q) return;
  const ex = side>0 ? W-140 : 140, ey = q[1] + (dy ?? -70); x.strokeStyle = `rgba(91,15,34,${.85*p})`; x.lineWidth = 2.5; x.beginPath(); x.moveTo(q[0],q[1]); x.lineTo(lerp(q[0],ex,p), lerp(q[1],ey,p)); x.stroke();
  x.fillStyle = C.ink; x.beginPath(); x.arc(q[0],q[1],8,0,6.283); x.fill(); x.save(); x.globalAlpha = p; x.font = `500 30px ${MONO}`; x.letterSpacing='4px'; x.fillStyle = C.ink; x.textAlign = side>0 ? 'right' : 'left'; x.textBaseline='bottom'; x.fillText(txt.toUpperCase(), ex, ey-10); x.restore(); }); }

/* ---------- Texte : les phrases du site ---------- */
function line(txt, lt, y, size, hot=false) { const sc = 1.14 - .14*eo(lt/.28); if (lt <= 0) return;
  x.save(); x.translate(W/2, y); x.scale(sc, sc); x.font = `600 ${size}px ${SANS}`; x.letterSpacing = `${-size*.05}px`; x.textAlign='center'; x.textBaseline='middle'; x.globalAlpha = clamp(lt/.06);
  if (hot) { const g = x.createLinearGradient(-W*.4,0,W*.4,0); g.addColorStop(0,'#E0607F'); g.addColorStop(1,'#A83253'); x.fillStyle = g; } else x.fillStyle = C.ink;
  x.shadowColor='rgba(255,240,243,1)'; x.shadowBlur=36; x.fillText(txt, 0, 0); x.fillText(txt, 0, 0); x.restore(); }
function scrim(y, h, a=.78) { const g = x.createLinearGradient(0,y-h/2,0,y+h/2); g.addColorStop(0,'rgba(255,232,237,0)'); g.addColorStop(.3,`rgba(255,232,237,${a})`); g.addColorStop(.7,`rgba(255,232,237,${a})`); g.addColorStop(1,'rgba(255,232,237,0)'); x.fillStyle = g; x.fillRect(0,y-h/2,W,h); }
function duo(a, b, lt, y=H*.5, sa=110, sb=150) { if (lt > 0) scrim(y, 520, .78*clamp(lt/.15)); line(a, lt, y - sb*.5, sa); line(b, lt - .14, y + sa*.55, sb, true); }
function tag(txt, y, a=1) { x.save(); x.globalAlpha = a; x.font = `500 28px ${MONO}`; x.letterSpacing = '6px'; x.fillStyle = C.ink; x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt.toUpperCase(), W/2, y); x.restore(); }
function veil(a) { x.fillStyle = `rgba(255,232,237,${a})`; x.fillRect(0,0,W,H); }

/* ---------- Plans ---------- */
const S = {
  // contre-plongée depuis les pieds, la caméra monte le long du corps
  montee: (lt,d,T) => { bg(T, .6*(1-eo(lt/.5))); const cam = camOf({ ty:-.85, yaw:-.5, pitch:-.75, dist:.55, f:1100, roll:.12 }, { ty:.42, yaw:.25, pitch:-.28, dist:1.15, f:1100, roll:-.05 }, eio(lt/d), T, .01); body(cam, { rev: 0, light: lerp(-.95, .6, eio(lt/d)), pass: 1, dir: -1 }); bars(); },
  // recul brutal : le corps entier
  entier: (lt,d,T) => { bg(T); const cam = camOf({ ty:.42, yaw:.25, pitch:-.1, dist:.5, f:1300 }, { ty:-.1, yaw:1.3, pitch:.1, dist:3.0, f:1300 }, eo(lt/(d*.7)), T); body(cam, { rev: 1, light: Math.sin(lt*3)*.9 }); veil(.15); if (lt > .15) scrim(H*.5, 560, .75*clamp((lt-.15)/.15)); line('Votre corps,', lt-.15, H*.445, 150); line('vu en entier.', lt-.6, H*.555, 170, true); bars(); },
  // la caméra rase la peau du dos
  peau: (lt,d,T) => { bg(T); const cam = camOf({ tx:0, ty:.46, tz:0, yaw:1.6, pitch:.55, dist:.62, f:900, roll:.3 }, { tx:0, ty:.34, tz:0, yaw:5.6, pitch:.2, dist:.55, f:900, roll:-.2 }, eio(lt/d), T, .012); body(cam, { rev: 0, light: lerp(.62, .12, eio(lt/d)), pass: 1, dir: 1, band: .04 }); sparks(T, cam); duo('Votre peau,', 'vue sous tous les angles.', lt-.1, H*.5, 110, 92); bars(); },
  // vue du dessus qui plonge dans le cœur
  coeur: (lt,d,T) => { bg(T); const cam = camOf({ tx:-.045, ty:.44, tz:.06, yaw:.6, pitch:1.25, dist:1.9, f:1300, roll:.5 }, { tx:-.045, ty:.44, tz:.06, yaw:.05, pitch:.12, dist:.42, f:1300, roll:0 }, eio(lt/d), T, .008); body(cam, { rev: 1, alpha: .8 }); heart(T, cam); duo('Votre cœur,', 'écouté de près.', lt-.1, H*.64, 104, 130); bars(); },
  // travelling le long du bras, avec le sang
  sang: (lt,d,T) => { bg(T); const p = eio(lt/d), a = along(PATHS[1], lerp(.15, .95, p)); const cam = camOf({ tx:a[0], ty:a[1], tz:a[2], yaw:-1.0, pitch:.35, dist:.5, f:1000, roll:-.5 }, { tx:a[0], ty:a[1], tz:a[2], yaw:-.3, pitch:.15, dist:.75, f:1000, roll:-.2 }, p, T, .01); body(cam, { rev: 1, alpha: .55 }); blood(T, cam, 1, .9); duo('Une prise de sang,', 'sans attendre.', lt-.1, H*.5, 92, 136); bars(); },
  // plan large qui tourne, avec les repères
  medecin: (lt,d,T) => { bg(T); const cam = camOf({ ty:-.08, yaw:-.5, pitch:.05, dist:2.9, f:1500, roll:-.04 }, { ty:-.08, yaw:.35, pitch:.12, dist:2.6, f:1500, roll:.03 }, lt/d, T); body(cam, { rev: 1 }); heart(T, cam, .8); if (lt > .1) scrim(H*.232, 560, .78*clamp((lt-.1)/.15)); line('Une consultation', lt-.1, H*.175, 92); line('par un médecin', lt-.22, H*.23, 92); line('qui vous explique.', lt-.34, H*.292, 108, true); callouts(cam, lt-.5); bars(); },
  // montage : un angle par 4 images
  montage: (lt,d,T) => { bg(T); const A = [ { ty:.4, yaw:.3, pitch:-.6, dist:.7, f:1000, roll:.3 }, { ty:-.5, yaw:2.2, pitch:.9, dist:1.2, f:1200, roll:-.4 }, { tx:.3, ty:.1, yaw:-1.2, pitch:.2, dist:.45, f:900, roll:.6 }, { ty:.1, yaw:3.6, pitch:-.2, dist:2.2, f:1500 }, { tx:-.045, ty:.44, yaw:.1, pitch:.3, dist:.5, f:1200, roll:-.2 }, { ty:-.7, yaw:.9, pitch:-.9, dist:.6, f:1000, roll:.2 } ];
    const k = Math.floor(lt/.13) % A.length, cam = mkcam({ ...A[k], dist: A[k].dist * (1 - ((lt%.13)/.13)*.12) }); body(cam, { rev: k%2, light: (k%3===0) ? .3 : 9 }); if (k===4) heart(T, cam); if (k===2) blood(T, cam); bars(); },
  // contre-plongée héroïque, la caméra avance
  phrase: (lt,d,T) => { bg(T, .1); const cam = camOf({ ty:-.2, yaw:-.35, pitch:-.42, dist:2.9, f:1400, roll:-.06 }, { ty:0, yaw:.2, pitch:-.3, dist:2.1, f:1400, roll:.04 }, eo(lt/d), T); body(cam, { rev: 0, light: lerp(-.95, .7, eio(lt/1.5)), pass: 1, dir: -1 }); sparks(T, cam, .7); veil(.12); scrim(H*.475, 640, .8*clamp(lt/.2));
    line("Tout ce qu'un", lt-.1, H*.4, 118); line('check-up classique', lt-.26, H*.47, 118); line('ne voit pas.', lt-.42, H*.55, 150, true); bars(); },
  // plongée finale vers le cœur, jusqu'au blanc
  serez: (lt,d,T) => { bg(T, ei(lt/d)*.9); const cam = camOf({ tx:-.02, ty:.3, yaw:.4, pitch:.1, dist:2.2, f:1300, roll:.1 }, { tx:-.045, ty:.44, tz:.06, yaw:0, pitch:.05, dist:.12, f:1300, roll:0 }, ei(lt/d), T, .01); body(cam, { rev: 1 }); heart(T, cam); scrim(H*.5, 420, .7); line('Vous en serez ?', lt-.1, H*.5, 150, true); bars(1 - ei(lt/d)); },
  fin: (lt,d,T) => { bg(T, .25*(1-eo(lt/.6))); const cam = camOf({ ty:.05, yaw:T*.9, pitch:.12, dist:3.6, f:1500 }, { ty:.05, yaw:T*.9, pitch:.12, dist:3.9, f:1500 }, lt/d, T, .002), up = { ...cam }; x.save(); x.translate(0, -H*.14); body(up, { rev: 1, light: Math.sin(lt*1.7)*.9 }); heart(T, up, .6); x.restore();
    const rev = eio((lt-.2)/.6), y0 = H*.6 - 110, y1 = H*.6 + 110, yy = lerp(y0,y1,rev);
    x.save(); x.beginPath(); x.rect(0,0,W,yy); x.clip(); x.fillStyle = C.ink; x.font = `600 200px ${SANS}`; x.letterSpacing='46px'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('MIRI', W/2+23, H*.6); x.restore();
    if (rev > 0 && rev < 1) { x.save(); x.fillStyle='#fff'; x.shadowColor='rgba(255,255,255,1)'; x.shadowBlur=40; x.fillRect(W*.12, yy-3, W*.76, 6); x.restore(); }
    tag('Pré-lancement · Paris', H*.6 + 150, eo((lt-.8)/.4));
    const p3 = eo((lt-1.2)/.5); if (p3 > 0) { x.save(); x.globalAlpha = p3; const bw=740,bh=110,bx=W/2-bw/2,by=H*.715; x.shadowColor='rgba(91,15,34,.35)'; x.shadowBlur=40; x.shadowOffsetY=14; x.fillStyle=C.ink; x.beginPath(); x.roundRect(bx,by,bw,bh,55); x.fill();
      x.shadowBlur=0; x.shadowOffsetY=0; x.fillStyle='#FFF0F3'; x.font=`500 40px ${SANS}`; x.letterSpacing='0px'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('Demander une invitation · lien en bio', W/2, by+bh/2+2); x.restore(); } }
};
const PLAN = [['montee',1.5],['entier',1.7],['peau',1.4],['coeur',1.4],['sang',1.4],['medecin',1.8],['montage',.8],['phrase',2.0],['serez',1.2],['fin',3.4]];
const SCENES = []; { let t = 0; for (const [k,d] of PLAN) { SCENES.push([t, t+d, S[k], d, k]); t += d; } }
const DURATION = SCENES[SCENES.length-1][1];
function draw(t) {
  FRAME = Math.round(t*30);
  x.setTransform(1,0,0,1,0,0); x.globalAlpha=1; x.shadowBlur=0; x.shadowOffsetY=0; x.letterSpacing='0px';
  const s = SCENES.find(([a,b]) => t>=a && t<b) || SCENES[SCENES.length-1], lt = t - s[0];
  s[2](lt, s[3], t);
  grain();
  if (s[0] > 0 && lt < .1) { x.fillStyle = `rgba(255,255,255,${(s[4]==='fin' ? 1 : .6)*(1-lt/.1)})`; x.fillRect(0,0,W,H); }
  if (t < .3) { x.fillStyle = `rgba(255,255,255,${1 - t/.3})`; x.fillRect(0,0,W,H); }
  if (t > DURATION-.45) { x.fillStyle = `rgba(255,255,255,${clamp((t-(DURATION-.45))/.45)})`; x.fillRect(0,0,W,H); }
}
window.ready = Promise.all([document.fonts.load(`600 200px "Inter Tight"`), document.fonts.load(`500 40px "Inter Tight"`), document.fonts.load(`500 28px "JetBrains Mono"`)]).catch(()=>{}).then(()=>document.fonts.ready);
window.draw = draw; window.DURATION = DURATION;
if (!location.search.includes('rec')) { const t0 = performance.now(); const loop = () => { draw(((performance.now()-t0)/1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>

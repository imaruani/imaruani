<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, c = document.getElementById('c'), x = c.getContext('2d');
const C = { bg:'#14020A', b:'#5B0F22', b2:'#8E2B44', r:'#F5DDE0', rg:'#FFB8C6', deep:'#C9516C' };
const SANS = '"Inter Tight","Inter Display",Inter,sans-serif', MONO = '"JetBrains Mono","DejaVu Sans Mono",monospace';
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- Corps en particules ---------- */
const pts = [];
const cap = (a, b, r0, r1, n, zs=.8) => {
  const ax=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], L=Math.hypot(...ax)||1, d=ax.map(v=>v/L);
  let u = Math.abs(d[1])<.9 ? [d[2],0,-d[0]] : [1,0,0]; const ul=Math.hypot(...u); u=u.map(v=>v/ul);
  const v=[d[1]*u[2]-d[2]*u[1], d[2]*u[0]-d[0]*u[2], d[0]*u[1]-d[1]*u[0]];
  for (let i=0;i<n;i++){ const t=rnd(), th=rnd()*6.283, r=r0+(r1-r0)*t, cx=Math.cos(th)*r, sy=Math.sin(th)*r;
    pts.push([a[0]+ax[0]*t+u[0]*cx+v[0]*sy, a[1]+ax[1]*t+u[1]*cx+v[1]*sy, (a[2]+ax[2]*t+u[2]*cx+v[2]*sy)*zs]); }
};
const ell = (c0, rx, ry, rz, n) => { for (let i=0;i<n;i++){ const y=1-2*rnd(), r=Math.sqrt(1-y*y), th=rnd()*6.283; pts.push([c0[0]+Math.cos(th)*r*rx, c0[1]+y*ry, c0[2]+Math.sin(th)*r*rz]); } };
ell([0,.83,0],.095,.12,.105,420); cap([0,.64,0],[0,.73,0],.045,.042,80,1); cap([0,.55,0],[0,.16,0],.19,.135,900,.62);
cap([-.2,.57,0],[.2,.57,0],.06,.06,200,1); cap([0,.17,0],[0,-.02,0],.135,.16,380,.65);
for (const s of [-1,1]) { cap([s*.23,.56,0],[s*.29,.28,.02],.055,.042,220,1); cap([s*.29,.28,.02],[s*.33,.02,.06],.042,.03,180,1); ell([s*.34,-.05,.07],.03,.05,.022,60);
  cap([s*.085,-.02,0],[s*.1,-.46,0],.085,.055,400,1); cap([s*.1,-.46,0],[s*.11,-.88,-.01],.055,.035,300,1); cap([s*.11,-.91,-.02],[s*.115,-.93,.09],.035,.03,60,1); }

function darkBg(glow=1) {
  x.fillStyle = C.bg; x.fillRect(0,0,W,H);
  const g = x.createRadialGradient(W/2,H*.45,0,W/2,H*.45,W*.9);
  g.addColorStop(0,`rgba(142,43,68,${.42*glow})`); g.addColorStop(1,'rgba(20,2,10,0)');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  x.strokeStyle = 'rgba(245,221,224,.035)'; x.lineWidth = 1;
  for (let i=0;i<=W;i+=90){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,H); x.stroke(); }
  for (let j=0;j<=H;j+=90){ x.beginPath(); x.moveTo(0,j); x.lineTo(W,j); x.stroke(); }
}
function corners(a=1) {
  x.strokeStyle = `rgba(245,221,224,${.4*a})`; x.lineWidth = 2; const m=60, s=44;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([px,py,dx,dy])=>{ x.beginPath(); x.moveTo(px,py+dy*s); x.lineTo(px,py); x.lineTo(px+dx*s,py); x.stroke(); });
}
function mono(txt, px, py, size=26, col=C.r, align='center', a=1) {
  x.save(); x.globalAlpha = a; x.font = `500 ${size}px ${MONO}`; x.letterSpacing = `${size*.18}px`; x.fillStyle = col; x.textAlign = align; x.textBaseline='middle'; x.fillText(txt.toUpperCase(), px, py); x.restore();
}
function drawBody(t, cx, cy, R, alpha=1) {
  const ay = .4 + t*.7, sy=Math.sin(ay), cyy=Math.cos(ay), ax=.08, sx=Math.sin(ax), cxx=Math.cos(ax);
  const scan = Math.sin(t*1.9)*.95;
  x.strokeStyle = `rgba(245,221,224,${.16*alpha})`; x.lineWidth = 2;
  [.32,.46,.62].forEach(k=>{ x.beginPath(); x.ellipse(cx, cy+.97*R, R*k, R*k*.16, 0, 0, 6.283); x.stroke(); });
  for (const [px,py,pz] of pts) {
    let X = px*cyy - pz*sy, Z = px*sy + pz*cyy, Y = py*cxx - Z*sx; Z = py*sx + Z*cxx;
    const dep = clamp((Z+.3)/.6), near = Math.abs(py-scan) < .022;
    x.fillStyle = near ? `rgba(255,184,198,${.95*alpha})` : `rgba(245,221,224,${(.22+dep*.65)*alpha})`;
    const s = near ? 4.2 : 1.6 + dep*1.8;
    x.fillRect(cx+X*R-s/2, cy-Y*R-s/2, s, s);
  }
  const yS = cy - scan*R;
  x.save(); x.shadowColor='rgba(255,184,198,.9)'; x.shadowBlur=30; x.strokeStyle=`rgba(255,184,198,${.7*alpha})`; x.lineWidth=3;
  x.beginPath(); x.ellipse(cx, yS, R*.42, R*.06, 0, 0, 6.283); x.stroke(); x.restore();
}

/* ---------- Œil ---------- */
function eye(lt) {
  blackBg(.9);
  const s = 1 + lt*.06, cx = W/2, cy = H/2;
  x.save(); x.translate(cx,cy); x.scale(s,s);
  const ew = 440, eh = 250;
  const open = eio(lt/.5);
  x.save(); x.scale(1, .15 + .85*open);
  x.shadowColor='rgba(255,184,198,.7)'; x.shadowBlur=30; x.lineWidth=7;
  const g = x.createLinearGradient(-ew,-eh,ew,eh); g.addColorStop(0,'#FFD3DC'); g.addColorStop(.55,C.rg); g.addColorStop(1,C.deep);
  x.strokeStyle = g;
  x.beginPath(); x.moveTo(-ew,0); x.bezierCurveTo(-ew*.6,-eh*1.05, ew*.6,-eh*1.05, ew,0); x.bezierCurveTo(ew*.6,eh*1.05,-ew*.6,eh*1.05,-ew,0); x.closePath(); x.stroke();
  x.restore();
  x.globalAlpha = open;
  const br = 1 + .06*Math.sin(lt*3.2);
  const rg = x.createRadialGradient(0,0,0,0,0,200*br); rg.addColorStop(0,'rgba(255,184,198,.85)'); rg.addColorStop(.55,'rgba(201,81,108,.3)'); rg.addColorStop(1,'rgba(201,81,108,0)');
  x.fillStyle = rg; x.beginPath(); x.arc(0,0,200*br,0,6.283); x.fill();
  x.lineWidth = 5; x.strokeStyle = C.rg; x.beginPath(); x.arc(0,0,150,0,6.283); x.stroke();
  x.lineWidth = 2; x.strokeStyle = 'rgba(245,221,224,.45)'; x.beginPath(); x.arc(0,0,105,0,6.283); x.stroke();
  // anneau de points qui tourne
  for (let i=0;i<40;i++){ const a=i/40*6.283+lt*.5; x.fillStyle='rgba(255,184,198,.8)'; x.beginPath(); x.arc(Math.cos(a)*180,Math.sin(a)*180,4,0,6.283); x.fill(); }
  x.shadowColor='rgba(255,184,198,.9)'; x.shadowBlur=40; x.fillStyle=C.rg; x.beginPath(); x.arc(0,0,46,0,6.283); x.fill();
  x.fillStyle = C.bg; x.shadowBlur=0; x.beginPath(); x.arc(0,0,22,0,6.283); x.fill();
  const sy = Math.sin(lt*2.6)*120;
  x.shadowColor='rgba(255,184,198,1)'; x.shadowBlur=24; x.strokeStyle=C.rg; x.lineWidth=4; x.beginPath(); x.moveTo(-260,sy); x.lineTo(260,sy); x.stroke();
  x.restore();
  mono('Scan rétinien', W/2, H*.72, 26, C.rg, 'center', clamp(lt/.6));
  corners(clamp(lt/.4));
}

/* ---------- Électrocardiogramme ---------- */
function ecg(lt) {
  blackBg(.7);
  const y0 = H*.5, amp = 220, per = 520;
  const beat = u => { const k = ((u % per)+per)%per / per;
    if (k<.36) return 0; if (k<.40) return -.12*Math.sin((k-.36)/.04*Math.PI);
    if (k<.44) return 0; if (k<.46) return .18; if (k<.49) return -1; if (k<.52) return .45; if (k<.56) return 0;
    if (k<.68) return -.2*Math.sin((k-.56)/.12*Math.PI); return 0; };
  const head = eo(lt/1.4) * (W+80) - 40;
  x.save(); x.shadowColor='rgba(255,184,198,.95)'; x.shadowBlur=26; x.lineWidth=7; x.lineJoin='round'; x.lineCap='round';
  const g = x.createLinearGradient(0,0,W,0); g.addColorStop(0,'rgba(255,184,198,0)'); g.addColorStop(.35,C.rg); g.addColorStop(1,'#FFD3DC'); x.strokeStyle=g;
  x.beginPath(); for (let px=-40; px<=head; px+=4){ const py = y0 + beat(px+40)*amp; px===-40 ? x.moveTo(px,py) : x.lineTo(px,py); } x.stroke();
  x.fillStyle='#fff'; x.beginPath(); x.arc(head, y0+beat(head+40)*amp, 10, 0, 6.283); x.fill(); x.restore();
  const bpm = 60 + Math.round(3*Math.sin(lt*5));
  x.save(); x.globalAlpha = clamp((lt-.3)/.4); x.font = `500 200px ${MONO}`; x.letterSpacing='-6px'; x.fillStyle=C.r; x.textAlign='center';
  x.shadowColor='rgba(255,184,198,.5)'; x.shadowBlur=30; x.fillText(String(bpm), W/2, H*.3); x.restore();
  mono('BPM · Rythme cardiaque', W/2, H*.3+60, 26, C.rg, 'center', clamp((lt-.3)/.4));
  corners();
}


/* ---------- Mystère : outils ---------- */
const GL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=?/<>ミリ';
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
let FRAME = 0;
function dec(str, p, salt=0) { const n = str.length; return [...str].map((ch, i) => (ch === ' ' || i / n < p) ? ch : GL[Math.floor(hash(i + salt * 97, Math.floor(FRAME / 2)) * GL.length)]).join(''); }
function blackBg(glow=.6) {
  x.fillStyle = '#0A0105'; x.fillRect(0,0,W,H);
  const g = x.createRadialGradient(W/2,H*.48,0,W/2,H*.48,W*.8); g.addColorStop(0,`rgba(91,15,34,${.5*glow})`); g.addColorStop(1,'rgba(10,1,5,0)');
  x.fillStyle = g; x.fillRect(0,0,W,H);
}
function vignette() { const g = x.createRadialGradient(W/2,H/2,W*.35,W/2,H/2,H*.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.75)'); x.fillStyle=g; x.fillRect(0,0,W,H); }
function grain() { for (let i=0;i<900;i++){ const r = hash(i, FRAME); const r2 = hash(i+5000, FRAME); x.fillStyle = `rgba(245,221,224,${.03 + r*.05})`; x.fillRect(r*W, r2*H, 2, 2); } }
function bigText(lines, lt, opts={}) {
  const size = opts.size || 112, lh = size*1.08; x.font = `500 ${size}px ${SANS}`; x.letterSpacing = `${-size*.04}px`; x.textAlign='center'; x.textBaseline='alphabetic';
  const y0 = (opts.y || H/2) - lines.length*lh/2 + size*.8;
  lines.forEach((ln, i) => {
    const p = clamp((lt - (opts.start||.1) - i*.35)/.7); if (p <= 0) return;
    const txt = dec(ln, p, i+1);
    x.save(); x.globalAlpha = Math.min(1, p*3);
    if (opts.grad && i === lines.length-1) { const g = x.createLinearGradient(W*.2,0,W*.8,0); g.addColorStop(0,'#FFD3DC'); g.addColorStop(.5,C.rg); g.addColorStop(1,C.deep); x.fillStyle=g; } else x.fillStyle = C.r;
    x.shadowColor = 'rgba(255,184,198,.35)'; x.shadowBlur = 24; x.fillText(txt, W/2, y0 + i*lh); x.restore();
  });
}
function bodyLit(t, cx, cy, R, lx, ly, LR, alpha=1) {
  const ay = .4 + t*.6, sy=Math.sin(ay), cyy=Math.cos(ay), ax=.08, sx=Math.sin(ax), cxx=Math.cos(ax);
  for (const [px,py,pz] of pts) {
    let X = px*cyy - pz*sy, Z = px*sy + pz*cyy, Y = py*cxx - Z*sx; Z = py*sx + Z*cxx;
    const dep = clamp((Z+.3)/.6), X2 = cx+X*R, Y2 = cy-Y*R, lit = Math.max(0, 1 - Math.hypot(X2-lx, Y2-ly)/LR);
    const a = (.07 + dep*.13 + lit*lit*.85) * alpha; if (a < .02) continue;
    x.fillStyle = lit > .6 ? `rgba(255,200,212,${a})` : `rgba(245,221,224,${a})`;
    const s = 1.6 + dep*1.6 + lit*1.4; x.fillRect(X2-s/2, Y2-s/2, s, s);
  }
  const g = x.createRadialGradient(lx,ly,0,lx,ly,LR); g.addColorStop(0,`rgba(255,184,198,${.12*alpha})`); g.addColorStop(1,'rgba(255,184,198,0)'); x.fillStyle=g; x.beginPath(); x.arc(lx,ly,LR,0,6.283); x.fill();
}
function glitch(amount) {
  if (amount <= 0) return;
  off.getContext('2d').drawImage(c,0,0); const o = off;
  for (let i=0;i<14;i++){ const y = hash(i, FRAME)*H, h = 20 + hash(i+50, FRAME)*120, dx = (hash(i+99, FRAME)-.5)*120*amount;
    x.drawImage(o, 0, y, W, h, dx, y, W, h); }
  x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = .25*amount; x.drawImage(o, 8*amount, 0); x.restore();
}
const off = document.createElement('canvas'); off.width = W; off.height = H;

/* ---------- Outils rapides ---------- */
function punch(lt, d=.35) { const p = eo(lt/d); return 1.12 - .12*p; }
function slam(word, lt, opts={}) {
  const size = opts.size || 230; const sc = punch(lt, .3);
  x.save(); x.translate(W/2, opts.y || H/2); x.scale(sc, sc);
  x.font = `600 ${size}px ${SANS}`; x.letterSpacing = `${-size*.05}px`; x.textAlign='center'; x.textBaseline='middle';
  if (opts.grad) { const g = x.createLinearGradient(-W*.4,0,W*.4,0); g.addColorStop(0,'#FFD3DC'); g.addColorStop(.5,C.rg); g.addColorStop(1,C.deep); x.fillStyle = g; } else x.fillStyle = C.r;
  x.shadowColor = 'rgba(255,184,198,.45)'; x.shadowBlur = 40; x.globalAlpha = clamp(lt/.06);
  x.fillText(word, 0, 0); x.restore();
}
function label(txt, lt, y) { mono(txt, W/2, y || H*.62, 26, C.rg, 'center', clamp((lt-.08)/.15)); }
function hud(lt) { corners(.7); mono('MIRI · Scan ' + String(Math.min(99, Math.floor(lt*60))).padStart(2,'0') + '%', 90, 110, 22, C.rg, 'left', .7); }
function wipe(lt) { // balayage lumineux à chaque coupe
  if (lt > .22) return; const y = eio(lt/.22) * (H + 200) - 100;
  const g = x.createLinearGradient(0, y-160, 0, y); g.addColorStop(0,'rgba(255,184,198,0)'); g.addColorStop(1,'rgba(255,184,198,.35)');
  x.fillStyle = g; x.fillRect(0, y-160, W, 160);
  x.fillStyle = '#FFE3EA'; x.shadowColor = 'rgba(255,184,198,1)'; x.shadowBlur = 30; x.fillRect(0, y-2, W, 4); x.shadowBlur = 0;
}
function rings(lt, cx, cy, n=4, base=120) {
  for (let i=0;i<n;i++){ const r = base + i*90 + (lt*120 % 90); x.strokeStyle = `rgba(245,221,224,${.35 - i*.07})`; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, r, 0, 6.283); x.stroke(); }
  const a = lt*3; x.strokeStyle = C.rg; x.lineWidth = 5; x.lineCap='round'; x.beginPath(); x.arc(cx, cy, base+90, a, a+1.1); x.stroke();
}
function flow(lt) { // particules qui montent (sang)
  for (let i=0;i<500;i++){ const px = hash(i,1)*W, sp = 200 + hash(i,2)*700, py = H - ((lt*sp + hash(i,3)*H) % (H+40)); const r = 2 + hash(i,4)*4;
    x.fillStyle = `rgba(255,${150+Math.floor(hash(i,5)*60)},${170+Math.floor(hash(i,6)*40)},${.25+hash(i,7)*.5})`; x.beginPath(); x.arc(px + Math.sin(lt*2+i)*14, py, r, 0, 6.283); x.fill(); }
}

/* ---------- Scènes ---------- */
const S = {
  open: lt => { blackBg(.9); bodyLit(lt*2.2, W/2, H*.5, 680, W/2, H*.5 - Math.sin(lt*3)*500, 520); hud(lt); },
  w1:   lt => { blackBg(.7); slam('Votre', lt); },
  w2:   lt => { blackBg(.8); bodyLit(lt*2+1, W/2, H*.55, 900, W/2, H*.4, 500, .5); slam('corps,', lt); },
  w3:   lt => { blackBg(.9); slam('vu en', lt, { y: H*.44 }); slam('entier.', lt-.12, { y: H*.56, grad: true }); },
  ecgF: lt => { ecg(lt*1.8 + .3); },
  peau: lt => { blackBg(.8); bodyLit(lt*2+3, W/2, H*1.02, 1500, W/2, H*.35 + lt*300, 600, .9); slam('Peau', lt, { y: H*.5 }); label('Imagerie du corps entier', lt, H*.58); hud(lt); },
  coeur:lt => { ecg(lt*2 + 1); x.fillStyle='rgba(10,1,5,.55)'; x.fillRect(0,0,W,H); slam('Cœur', lt, { y: H*.5 }); label('ECG · Tension', lt, H*.58); },
  sang: lt => { blackBg(.7); flow(lt); slam('Sang', lt, { y: H*.5 }); label('Analysé sur place', lt, H*.58); },
  med:  lt => { blackBg(.8); rings(lt, W/2, H*.5); slam('Médecin', lt, { y: H*.5, size: 200 }); label('Résultats expliqués le jour même', lt, H*.58); },
  stat1:lt => { blackBg(.8); const n = Math.min(60, Math.floor(eo(lt/.5)*60)); slam(n + ' min', lt, { size: 250, grad: true }); label('Pour tout savoir', lt, H*.6); },
  stat2:lt => { blackBg(.8); slam('0', lt, { size: 340 }); label('Salle d\'attente', lt, H*.61); },
  mont: lt => { const k = Math.floor(lt/.11) % 4;
    if (k===0) { blackBg(.7); bodyLit(lt*5, W/2, H*.5, 700, W/2, H*.3, 500); }
    if (k===1) { ecg(lt*3 + 1); }
    if (k===2) { blackBg(.7); flow(lt*2); }
    if (k===3) { blackBg(.8); rings(lt*2, W/2, H/2, 5, 80); } },
  line: lt => { blackBg(.8); const L = ['Tout ce qu\'un', 'check-up classique', 'ne voit pas.'];
    x.font = `600 104px ${SANS}`; x.letterSpacing = '-4px'; x.textAlign='center'; x.textBaseline='alphabetic';
    L.forEach((l,i) => { const p = eo((lt - i*.18)/.25); if (p<=0) return; x.save(); x.globalAlpha=p; x.translate(0,(1-p)*60);
      if (i===2) { const g = x.createLinearGradient(W*.2,0,W*.8,0); g.addColorStop(0,'#FFD3DC'); g.addColorStop(1,C.deep); x.fillStyle=g; } else x.fillStyle=C.r;
      x.shadowColor='rgba(255,184,198,.35)'; x.shadowBlur=30; x.fillText(l, W/2, H*.43 + i*118); x.restore(); }); },
  end:  lt => { blackBg(1); bodyLit(lt*.8+5, W/2, H*.4, 540, W/2, H*.4 - Math.sin(lt*1.5)*380, 460, .8);
    // MIRI révélé par une ligne de scan
    const rev = eio(lt/.7), y0 = H*.72 - 150, y1 = H*.72 + 30, yy = y0 + (y1-y0)*rev;
    x.save(); x.beginPath(); x.rect(0, 0, W, yy); x.clip();
    x.fillStyle=C.r; x.font=`600 200px ${SANS}`; x.letterSpacing='44px'; x.textAlign='center'; x.shadowColor='rgba(255,184,198,.55)'; x.shadowBlur=44; x.fillText('MIRI', W/2+22, H*.72); x.restore();
    if (rev < 1) { x.fillStyle='#FFE3EA'; x.shadowColor='rgba(255,184,198,1)'; x.shadowBlur=30; x.fillRect(W*.15, yy-2, W*.7, 4); x.shadowBlur=0; }
    mono('Pré-lancement · Paris', W/2, H*.72+70, 26, C.rg, 'center', clamp((lt-.6)/.3));
    const p3 = eo((lt-.9)/.4);
    if (p3>0){ x.save(); x.globalAlpha=p3; const bw=640,bh=104,bx=W/2-bw/2,by=H*.81;
      x.shadowColor='rgba(255,184,198,.7)'; x.shadowBlur=40; x.fillStyle=C.r; x.beginPath(); x.roundRect(bx,by,bw,bh,52); x.fill();
      x.shadowBlur=0; x.fillStyle='#14020A'; x.font=`500 38px ${SANS}`; x.letterSpacing='0px'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('Demander une invitation · lien en bio', W/2, by+bh/2+2); x.restore(); }
    corners(.6); }
};
const PLAN = [['open',1.4],['w1',.55],['w2',.55],['w3',.9],['ecgF',.8],['peau',.75],['coeur',.75],['sang',.75],['med',.75],['stat1',.9],['stat2',.7],['mont',.9],['line',1.6],['end',3.2]];
const SCENES = []; { let t = 0; for (const [k,d] of PLAN) { SCENES.push([t, t+d, S[k]]); t += d; } }
const DURATION = SCENES[SCENES.length-1][1];
function draw(t) {
  FRAME = Math.round(t*30);

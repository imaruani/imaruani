<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paros &middot; Carte des bonnes adresses</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Paros &amp; Antiparos</h1>
      <p class="subtitle">Carte des bonnes adresses</p>
    </header>

    <div class="filters">
      <div class="filter-row" id="islandFilter">
        <button data-island="all" class="active">Tout</button>
        <button data-island="Paros">Paros</button>
        <button data-island="Antiparos">Antiparos</button>
        <button data-island="Athènes">Athènes</button>
        <button data-island="Sifnos">Sifnos</button>
        <button data-island="Milos">Milos</button>
        <button data-island="Kimolos">Kimolos</button>
      </div>

      <div class="filter-row" id="categoryFilter">
        <button data-category="all" class="active">Toutes catégories</button>
        <button data-category="restaurant">Restos</button>
        <button data-category="beach">Plages</button>
        <button data-category="bar">Bars / sunset</button>
        <button data-category="hotel">Hôtels</button>
        <button data-category="breakfast">Petit déj</button>
        <button data-category="activity">Activités</button>
      </div>

      <label class="toggle">
        <input type="checkbox" id="favOnly" />
        <span>Seulement les coups de cœur <span class="star">★</span></span>
      </label>
    </div>

    <div class="list-wrapper">
      <input id="search" type="search" placeholder="Rechercher un lieu, une zone…" />
      <ul id="placeList"></ul>
    </div>

    <footer>
      <p>Carte établie à partir de 5 listes d'adresses. Les <span class="star">★</span> sont les coups de cœur, les <span class="resa">⛔</span> sont à réserver.</p>
    </footer>
  </aside>

  <main id="mapWrap">
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./places.js"></script>
  <script src="./app.js"></script>
</body>
</html>
